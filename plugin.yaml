version: 0.1
# The grype override below uses `${env.HOME}`, which older CLIs do not expand
# inside a linter environment. Pinning the floor here means a repository on an
# older CLI fails loudly instead of silently writing its database somewhere else.
required_trunk_version: ">=1.22.2"

lint:
  definitions:
    # One vulnerability database for the machine, not one per repository.
    #
    # The upstream grype plugin sets GRYPE_DB_CACHE_DIR to
    # `${shared_cachedir}/grype/db`, where "shared" means shared between the
    # linters of a *single* repository. Every repository therefore downloaded and
    # kept its own copy of the same upstream database: on the Critical Mass
    # runner that was 61 copies at 1.9 GB — 115 GB, and effectively the whole
    # trunk cache.
    #
    # The `PATH` entry is repeated verbatim from the upstream definition because
    # Trunk replaces a sequence rather than merging into it ("to override a
    # sequence value in the default it is necessary to fully specify the new
    # sequence"). Dropping it leaves grype without its shim on PATH, and it does
    # not run at all.
    - name: grype
      environment:
        - name: GRYPE_DB_CACHE_DIR
          value: ${env.HOME}/.cache/grype-shared/db
        - name: PATH
          list: ["${linter}", "${env.PATH}"]

    # pinact v5 compatibility, until upstream releases trunk-io/plugins#1180.
    #
    # Upstream's wrapper (v1.11.0, and main as of 2026-10-07) builds
    # `pinact run -format sarif`. pinact v5 rejects single-dash long flags, so on
    # every repository that pins pinact@5 each pull request touching a workflow
    # failed changed-file linting with "unknown flag: -format". The fleet keeps
    # pinact current rather than pinning it back, so these commands run upstream's
    # own wrapper (`${plugin}` is upstream's directory, where pinact is defined)
    # with only its argument builder adjusted: single-dash long flags become
    # double-dash, which pinact v4 accepts too and which is a no-op once upstream
    # emits them itself. `commands` is a sequence, so it is restated in full.
    #
    # Remove this definition once an upstream release contains #1180, and bump
    # the upstream ref in Alidade's trunk.yaml template.
    - name: pinact
      known_good_version: 5.0.0
      commands:
        - name: lint
          output: sarif
          run: >-
            python3 -c 'import importlib.util as u, sys; p = sys.argv[1]; sys.argv = [p, *sys.argv[2:]]; s = u.spec_from_file_location("pinact_run", p); m = u.module_from_spec(s); s.loader.exec_module(m); b = m.build_pinact_args; m.build_pinact_args = lambda mode: ["-" + a if a.startswith("-") and not a.startswith("--") and len(a) > 2 else a for a in b(mode)]; raise SystemExit(m.main())' ${plugin}/linters/pinact/pinact_run.py ${target}
          success_codes: [0, 1, 2, 3]
          batch: true
          cache_results: true
          is_security: true
          read_output_from: stdout
          disable_upstream: true
        - name: upgrade
          output: sarif
          run: >-
            python3 -c 'import importlib.util as u, sys; p = sys.argv[1]; sys.argv = [p, *sys.argv[2:]]; s = u.spec_from_file_location("pinact_run", p); m = u.module_from_spec(s); s.loader.exec_module(m); b = m.build_pinact_args; m.build_pinact_args = lambda mode: ["-" + a if a.startswith("-") and not a.startswith("--") and len(a) > 2 else a for a in b(mode)]; raise SystemExit(m.main())' ${plugin}/linters/pinact/pinact_run.py --upgrade ${target}
          success_codes: [0, 1, 2, 3]
          batch: true
          cache_results: true
          is_security: true
          read_output_from: stdout
          disable_upstream: true
          enabled: false

    # oxlint lints; Prettier formats. trunk-io/plugins v1.11.0 gave oxlint a
    # `format` command that runs `oxfmt --write` at its own 100-column default,
    # beside Prettier at the fleet's 80. Two formatters on the same JavaScript
    # rewrite each other's output, and Trunk then reports every touched file as
    # unformatted however it was written (Alidade #127, 2026-10-08). The fleet
    # formatter is Prettier, so the oxfmt command is restated disabled; the lint
    # command is restated unchanged because `commands` is a sequence.
    - name: oxlint
      commands:
        - name: lint
          output: sarif
          run: oxlint --format sarif ${target}
          success_codes: [0, 1]
          batch: true
          cache_results: true
          read_output_from: stdout
        - name: format
          output: rewrite
          run: oxfmt --write ${target}
          success_codes: [0]
          batch: true
          cache_results: true
          formatter: true
          in_place: true
          enabled: false

tools:
  definitions:
    - name: pinact
      known_good_version: 5.0.0
