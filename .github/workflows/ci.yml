---
# GitHub Actions — fleet verification workflow.
# Rendered into a repository by `fleet_render.py` from `.fleet/lock.json` and
# checked by its first step; edit the template or the lock inputs, never the
# rendered file.
#
# LINUX_RUNNER must select admitted self-hosted capacity for trusted private
# code. Public or fork code needs isolated hosted execution and never shares a
# persistent runner. Confirm runner-group membership, architecture and
# capacity before dispatch (github-trunk-target.md, runner admission).
#
# The required gate runs on a bounded Linux runner. It used to run on the
# retained Mac, and that arrangement failed in two ways worth naming here,
# because a template is where they would otherwise come back:
#
#   * One machine serialised the fleet. A capacity guard that gives up returns
#     exit 75 and the pull request reads as failing, when what happened is that
#     three other repositories were building.
#   * A retained runner accumulates state. Components installed by hand years
#     ago made repositories look as though they declared their toolchain when
#     they did not, and the first clean runner found each omission at once.
#
# macOS coverage does not disappear; it moves to `macos-compatibility.yml`,
# which runs nightly and advisory. Render both or neither — a repository with
# this file alone has silently dropped its macOS coverage, and the fleet CI
# policy audit reports that.
name: Fleet verification

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    fleet-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # A fresh runner cannot be checked out onto the wrong commit the way a
      # retained workspace can, but this is the assertion repository policies
      # name and reviewers rely on. It stays on the required job rather than
      # moving to one that is allowed to fail.
      - name: Confirm the checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # Every file rendered from a fleet template is hashed in
      # .fleet/lock.json. A hand edit would be overwritten by the next template
      # release, so it fails here instead of becoming churn later.
      - name: Check fleet-managed files
        run: python3 .fleet/fleet_render.py check

      # The action, not `mise install`. Every workflow in this fleet was
      # written for the retained Mac, which has had mise on it for as long as
      # it has been a runner, so `mise --version && mise install --yes` read as
      # correct and was. A bounded runner is fresh each time and has nothing:
      # the step fails at `mise: command not found` before reaching any of the
      # repository's own tooling. Arcana's split hit this on 2026-08-21.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # One fleet-wide mise version, kept current by Renovate's
          # mise-action version manager (renovate-github.json). On retained
          # runners every job shares one mise binary, and a job pinning a
          # different version makes mise-action `self-update` it; one version
          # means no flipping between jobs.
          version: 2026.10.2
          # Cache on hosted runners only. On a fresh runner the actions/cache
          # restore of mise's data directory saves a download. On the retained
          # self-hosted runners (cm-linux shares one disk between four) that
          # directory is already on disk: restoring it duplicates ~1.3 GiB per
          # job, took 151 s on average on 2026-10-07, and puts back every
          # version `mise prune` removed. The same applies to a pnpm store
          # under runner.tool_cache, which on such a host is one store per
          # runner; leave pnpm on its default store there.
          cache: ${{ runner.environment == 'github-hosted' }}
        env:
          # Authenticates mise-action's `mise self-update` of a shared
          # runner binary; unauthenticated it hits the 60/hour limit.
          MISE_GITHUB_TOKEN: ${{ github.token }}

      # fleet-allow: hosted-runner -- a public repository; public code never
      # runs on the fleet's shared self-hosted runners (runnerPolicy).

      # A change that touches only the paths below runs the repository's light
      # task instead of the full gate, when the repository defines one. The
      # required job still runs and still reports, so no path filter can leave
      # a pull request without its required check.
      - name: Classify the verification scope
        id: scope
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          LIGHT_TASK: ""
          LIGHT_PATHS: ""
        run: |
          set -f
          scope=validate
          zero=0000000000000000000000000000000000000000
          if test -n "$LIGHT_TASK" && test -n "$BASE_SHA" &&
            test "$BASE_SHA" != "$zero" &&
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
            mise tasks info "ci:$LIGHT_TASK" >/dev/null 2>&1; then
            scope=$LIGHT_TASK
            while IFS= read -r path; do
              light=false
              for pattern in $LIGHT_PATHS; do
                # The pattern is a glob on purpose.
                # shellcheck disable=SC2053
                [[ $path == $pattern ]] && light=true
              done
              if ! $light; then
                scope=validate
                break
              fi
            done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'Verification scope: %s\n' "$scope"

      # Every pnpm repository audits its lockfile in the required gate, rather
      # than the eight that happened to put `pnpm audit` in ci:validate. It
      # blocks an advisory in shipped dependencies that has a fix; one with no
      # fix cannot be acted on here, and a registry outage is not a verdict.
      # Fixes arrive through Renovate (vulnerability alerts, floor overrides).
      - name: Audit locked dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: >-
          pnpm audit --prod --audit-level high
          --ignore-unfixable --ignore-registry-errors

      # Observational by default (github-target.json lintAdoptionPolicy). A
      # repository that has closed its lint debt renders this as blocking.
      - name: Run changed-file linting
        if: hashFiles('scripts/trunk-observe.sh') != ''
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/trunk-observe.sh

      - name: Run repository-native verification
        env:
          # A retained runner keeps the Cargo target between jobs; harmless
          # where the repository builds no Rust.
          CARGO_TARGET_DIR: >-
            ${{ runner.tool_cache }}/cargo-target/${{ github.repository }}
        run: mise run "ci:${{ steps.scope.outputs.scope }}"
